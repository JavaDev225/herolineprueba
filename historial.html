<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Solicitudes | Heroline Shipping Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#F0F7FF',
                            100: '#E0EFFE',
                            200: '#BAE0FD',
                            300: '#75BFFB',
                            400: '#1A85CA',
                            500: '#0B59A1',
                            600: '#0B3B7B',
                            700: '#0A2E61',
                            800: '#072045',
                            900: '#04122B',
                        },
                        slate: {
                            50: '#F8FAFC',
                            100: '#F1F5F9',
                            200: '#E2E8F0',
                            300: '#CBD5E1',
                            400: '#94A3B8',
                            500: '#64748B',
                            600: '#475569',
                            700: '#334155',
                            800: '#1E293B',
                            900: '#0F172A'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        .fade-in {
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-brand-50/40 to-slate-100 text-slate-800 antialiased min-h-screen flex flex-col justify-between selection:bg-brand-600 selection:text-white">

    <!-- Encabezado -->
    <header class="w-full bg-white/90 backdrop-blur-md border-b border-slate-200/80 py-3.5 px-6 shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="homeanalista.html" class="bg-brand-600 text-white w-9 h-9 rounded-xl flex items-center justify-center font-bold text-lg shadow-sm hover:bg-brand-700 transition">
                    <i class="fa-solid fa-ship text-sm"></i>
                </a>
                <div>
                    <h1 class="font-bold tracking-tight text-base text-brand-600 leading-none">HEROLINE SHIPPING</h1>
                    <span class="text-[10px] text-slate-400 font-semibold tracking-wider uppercase">External Agency Platform</span>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <a href="homeanalista.html" class="px-3.5 py-2 rounded-xl text-xs font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 border border-slate-200 transition flex items-center gap-2">
                    <i class="fa-solid fa-arrow-left text-sm"></i>
                    <span>Volver al Panel</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-5xl mx-auto px-4 py-8 flex-grow w-full relative z-10 fade-in">
        
        <!-- Tarjeta de Título & Filtro -->
        <div class="bg-white p-6 md:p-8 rounded-2xl border border-slate-200 shadow-md mb-6">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-100 pb-5">
                <div>
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-brand-50 border border-brand-100 flex items-center justify-center text-brand-600">
                            <i class="fa-solid fa-rotate-left text-lg"></i>
                        </div>
                        <div>
                            <h2 class="text-xl md:text-2xl font-extrabold text-slate-900 tracking-tight">Request History</h2>
                            <p class="text-xs md:text-sm text-brand-600 font-semibold">Historial de Solicitudes Procesadas</p>
                        </div>
                    </div>
                </div>

                <!-- Buscador de Solicitudes -->
                <div class="relative w-full md:w-72">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-magnifying-glass text-xs"></i>
                    </span>
                    <input 
                        type="text" 
                        id="inputBusqueda" 
                        onkeyup="filtrarSolicitudes()"
                        placeholder="Buscar buque, área, código o analista..." 
                        class="w-full pl-9 pr-3 py-2 text-xs rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none transition font-medium"
                    >
                </div>
            </div>

            <!-- Resumen Estadístico Breve -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-5">
                <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Total Solicitudes</span>
                    <span id="statTotal" class="text-lg font-black text-slate-800">0</span>
                </div>
                <div class="bg-emerald-50 p-3 rounded-xl border border-emerald-100">
                    <span class="text-[10px] font-bold text-emerald-600 uppercase tracking-wider block">Estado</span>
                    <span class="text-xs font-bold text-emerald-700 flex items-center gap-1 mt-1">
                        <i class="fa-solid fa-circle-check text-[10px]"></i> Sincronizado
                    </span>
                </div>
            </div>
        </div>

        <!-- Contenedor Desplegable de Solicitudes -->
        <div id="listaSolicitudes" class="space-y-4">
            <!-- Las solicitudes procesadas se inyectarán dinámicamente aquí -->
        </div>

    </main>

    <!-- Pie de página -->
    <footer class="w-full bg-white/90 backdrop-blur-md border-t border-slate-200/80 py-3 text-center text-[11px] text-slate-400 relative z-10">
        Plataforma Corporativa de Agenciamiento Marítimo · Todos los derechos reservados
    </footer>

    <script>
        let todasLasSolicitudes = [];

        document.addEventListener('DOMContentLoaded', () => {
            cargarHistorial();
        });

        // Cargar solicitudes guardadas desde localStorage
        function cargarHistorial() {
            const data = localStorage.getItem('heroline_solicitudes');
            todasLasSolicitudes = data ? JSON.parse(data) : [];

            document.getElementById('statTotal').textContent = todasLasSolicitudes.length;

            renderizarSolicitudes(todasLasSolicitudes);
        }

        // Mostrar listado desplegable en el DOM
        function renderizarSolicitudes(lista) {
            const contenedor = document.getElementById('listaSolicitudes');
            contenedor.innerHTML = '';

            if (lista.length === 0) {
                contenedor.innerHTML = `
                    <div class="bg-white rounded-2xl border border-slate-200 p-12 text-center shadow-sm">
                        <div class="w-16 h-16 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center mx-auto mb-3">
                            <i class="fa-solid fa-folder-open text-2xl"></i>
                        </div>
                        <h3 class="text-base font-bold text-slate-800">No se encontraron solicitudes</h3>
                        <p class="text-xs text-slate-500 mt-1">Aún no se han guardado solicitudes externas en el sistema.</p>
                        <a href="solicitudexterna.html" class="inline-flex items-center gap-2 mt-4 px-4 py-2 rounded-xl text-xs font-bold text-white bg-brand-600 hover:bg-brand-700 transition">
                            <i class="fa-solid fa-plus text-xs"></i> Crear Nueva Solicitud
                        </a>
                    </div>
                `;
                return;
            }

            lista.forEach((sol, index) => {
                const idAccordion = `acc-${index}`;
                
                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl border border-slate-200/90 shadow-sm overflow-hidden transition-all duration-200 hover:border-brand-300';

                card.innerHTML = `
                    <!-- Encabezado de la Ventana (Desplegable) -->
                    <button 
                        type="button" 
                        onclick="toggleAccordion('${idAccordion}')" 
                        class="w-full p-5 text-left flex flex-col md:flex-row md:items-center justify-between gap-4 hover:bg-slate-50/80 transition cursor-pointer"
                    >
                        <div class="flex items-start md:items-center gap-3.5">
                            <div class="w-10 h-10 rounded-xl bg-brand-50 border border-brand-100 text-brand-600 font-extrabold text-xs flex items-center justify-center shrink-0">
                                ${sol.codigo}
                            </div>
                            <div>
                                <div class="flex items-center gap-2 flex-wrap">
                                    <h3 class="text-base font-bold text-slate-900">${sol.buque}</h3>
                                    <span class="px-2.5 py-0.5 rounded-md bg-brand-50 text-brand-700 border border-brand-100 font-bold text-[10px]">
                                        ${sol.area}
                                    </span>
                                </div>
                                <div class="text-xs text-slate-500 mt-0.5 flex items-center gap-4 flex-wrap">
                                    <span><i class="fa-solid fa-user-tie text-brand-600 mr-1"></i><strong>Analista:</strong> ${sol.responsable}</span>
                                    <span><i class="fa-regular fa-calendar text-slate-400 mr-1"></i>${sol.fecha}</span>
                                </div>
                            </div>
                        </div>

                        <div class="flex items-center justify-between md:justify-end gap-3 border-t md:border-t-0 pt-2 md:pt-0 border-slate-100">
                            <span class="text-xs font-bold text-brand-600 bg-brand-50 hover:bg-brand-100 px-3 py-1.5 rounded-lg border border-brand-100 flex items-center gap-1.5">
                                <i class="fa-solid fa-eye text-xs"></i> Ver Detalles
                            </span>
                            <div class="w-8 h-8 rounded-lg bg-slate-100 text-slate-500 flex items-center justify-center transition-transform duration-300" id="icon-${idAccordion}">
                                <i class="fa-solid fa-chevron-down text-xs"></i>
                            </div>
                        </div>
                    </button>

                    <!-- Cuerpo Desplegable (Detalles Ocultos) -->
                    <div id="${idAccordion}" class="hidden border-t border-slate-100 bg-slate-50/50 p-5">
                        
                        <!-- Detalles Claves -->
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4 bg-white p-4 rounded-xl border border-slate-200/80">
                            <div>
                                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Número de Solicitud</span>
                                <span class="text-xs font-extrabold text-brand-700">${sol.codigo}</span>
                            </div>
                            <div>
                                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Buque Dirigido</span>
                                <span class="text-xs font-bold text-slate-800">${sol.buque}</span>
                            </div>
                            <div>
                                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Área Dirigida</span>
                                <span class="text-xs font-bold text-slate-800">${sol.area}</span>
                            </div>
                        </div>

                        <!-- Lista de Materiales -->
                        <h4 class="text-xs font-extrabold text-slate-700 mb-2 uppercase tracking-wider flex items-center gap-1.5">
                            <i class="fa-solid fa-boxes-stacked text-brand-600"></i> Materiales / Insumos Requeridos
                        </h4>
                        
                        <div class="bg-white rounded-xl border border-slate-200 overflow-hidden mb-4">
                            <table class="w-full text-left text-xs border-collapse">
                                <thead>
                                    <tr class="bg-slate-100/80 text-[10px] font-extrabold uppercase text-slate-500 border-b border-slate-200">
                                        <th class="py-2.5 px-3 text-center w-12">N°</th>
                                        <th class="py-2.5 px-3">Descripción</th>
                                        <th class="py-2.5 px-3 text-right w-24">Cantidad</th>
                                        <th class="py-2.5 px-3 w-24">Unidad</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    ${sol.items.map((it, i) => `
                                        <tr>
                                            <td class="py-2 px-3 text-center font-bold text-slate-400">${i + 1}</td>
                                            <td class="py-2 px-3 font-medium text-slate-800">${it.descripcion}</td>
                                            <td class="py-2 px-3 text-right font-bold text-slate-900">${it.cantidad}</td>
                                            <td class="py-2 px-3 text-slate-500"><span class="bg-slate-100 px-2 py-0.5 rounded text-[10px] font-bold">${it.unidad}</span></td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>

                        <!-- Acciones -->
                        <div class="flex justify-end gap-2 pt-1">
                            <button 
                                onclick='reimprimirPDF(${JSON.stringify(sol)})' 
                                class="px-4 py-2 rounded-xl text-xs font-bold text-white bg-brand-600 hover:bg-brand-700 shadow-sm transition flex items-center gap-1.5"
                            >
                                <i class="fa-solid fa-file-pdf"></i> Descargar PDF
                            </button>
                        </div>
                    </div>
                `;

                contenedor.appendChild(card);
            });
        }

        // Alternar visibilidad de la ventana desplegable
        function toggleAccordion(id) {
            const el = document.getElementById(id);
            const icon = document.getElementById(`icon-${id}`);

            if (el.classList.contains('hidden')) {
                el.classList.remove('hidden');
                icon.style.transform = 'rotate(180deg)';
            } else {
                el.classList.add('hidden');
                icon.style.transform = 'rotate(0deg)';
            }
        }

        // Filtro de Búsqueda
        function filtrarSolicitudes() {
            const query = document.getElementById('inputBusqueda').value.toLowerCase();
            const filtradas = todasLasSolicitudes.filter(s => 
                s.codigo.toLowerCase().includes(query) ||
                s.buque.toLowerCase().includes(query) ||
                s.area.toLowerCase().includes(query) ||
                s.responsable.toLowerCase().includes(query)
            );
            renderizarSolicitudes(filtradas);
        }

        // Reimprimir PDF directamente desde la ventana desplegable del historial
        function reimprimirPDF(sol) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a4' });

            doc.setFont('helvetica', 'bold');
            doc.setFontSize(16);
            doc.setTextColor(11, 46, 97);
            doc.text("Heroline Shipping", 14, 18);

            doc.setFont('helvetica', 'normal');
            doc.setFontSize(8);
            doc.setTextColor(71, 85, 105);
            doc.text("PA-22, CC Ciudad Del Viento, Falcón, Venezuela", 14, 23);
            doc.text("Email: info@herolineshipping.com | Website: www.herolineshipping.com", 14, 27);

            doc.setFont('helvetica', 'bold');
            doc.setFontSize(14);
            doc.setTextColor(11, 46, 97);
            doc.text("SOLICITUD EXTERNA", 196, 18, { align: 'right' });

            doc.setFontSize(10);
            doc.setTextColor(15, 23, 42);
            doc.text(sol.codigo, 196, 23, { align: 'right' });

            doc.setFont('helvetica', 'normal');
            doc.setFontSize(8);
            doc.setTextColor(71, 85, 105);
            doc.text(`DATE: ${sol.fecha}`, 196, 27, { align: 'right' });

            doc.setDrawColor(186, 224, 253);
            doc.setLineWidth(0.6);
            doc.line(14, 31, 196, 31);

            doc.setFillColor(240, 247, 255);
            doc.setDrawColor(117, 191, 251);
            doc.roundedRect(14, 35, 182, 30, 1, 1, 'FD');

            doc.setFont('helvetica', 'bold');
            doc.setFontSize(8.5);
            doc.setTextColor(11, 59, 161);
            doc.text("INFORMACIÓN DE LA SOLICITUD", 18, 41);

            doc.setFont('helvetica', 'bold');
            doc.setFontSize(8);
            doc.setTextColor(71, 85, 105);
            doc.text("Vessel / Buque:", 18, 47);
            doc.setFont('helvetica', 'bold');
            doc.setTextColor(15, 23, 42);
            doc.text(sol.buque, 60, 47);

            doc.setFont('helvetica', 'bold');
            doc.setTextColor(71, 85, 105);
            doc.text("Área / Departamento:", 18, 53);
            doc.setFont('helvetica', 'bold');
            doc.setTextColor(15, 23, 42);
            doc.text(sol.area, 60, 53);

            doc.setFont('helvetica', 'bold');
            doc.setTextColor(71, 85, 105);
            doc.text("Responsable / Analista:", 18, 59);
            doc.setFont('helvetica', 'bold');
            doc.setTextColor(15, 23, 42);
            doc.text(sol.responsable, 60, 59);

            const tableData = sol.items.map((it, i) => [i + 1, it.descripcion, it.cantidad, it.unidad]);

            doc.autoTable({
                startY: 71,
                head: [['Item', 'Product / Service', 'Qty.', 'Unity']],
                body: tableData,
                theme: 'plain',
                headStyles: {
                    fillColor: [11, 59, 161],
                    textColor: [255, 255, 255],
                    fontStyle: 'bold',
                    fontSize: 8.5,
                    halign: 'left'
                },
                columnStyles: {
                    0: { halign: 'center', cellWidth: 18 },
                    1: { cellWidth: 114 },
                    2: { halign: 'center', cellWidth: 25 },
                    3: { halign: 'center', cellWidth: 25 }
                },
                styles: {
                    fontSize: 8,
                    cellPadding: 3,
                    textColor: [30, 41, 59],
                    lineColor: [186, 224, 253],
                    lineWidth: 0.3
                },
                margin: { left: 14, right: 14 }
            });

            let finalY = doc.lastAutoTable.finalY + 28;
            if (finalY > 250) { doc.addPage(); finalY = 40; }

            doc.setDrawColor(100, 116, 139);
            doc.setLineWidth(0.4);
            
            doc.line(25, finalY, 85, finalY);
            doc.setFontSize(8);
            doc.setFont('helvetica', 'bold');
            doc.setTextColor(15, 23, 42);
            doc.text("ANALISTA RESPONSABLE", 55, finalY + 5, { align: 'center' });
            doc.setFont('helvetica', 'normal');
            doc.setTextColor(71, 85, 105);
            doc.text(sol.responsable, 55, finalY + 9, { align: 'center' });

            doc.line(125, finalY, 185, finalY);
            doc.setFontSize(8);
            doc.setFont('helvetica', 'bold');
            doc.setTextColor(15, 23, 42);
            doc.text("COORDINADOR", 155, finalY + 5, { align: 'center' });
            doc.setFont('helvetica', 'normal');
            doc.setTextColor(71, 85, 105);
            doc.text("Luis Chirino", 155, finalY + 9, { align: 'center' });

            doc.save(`${sol.codigo} - ${sol.buque}.pdf`);
        }
    </script>
</body>
</html>
