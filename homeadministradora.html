<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrator Dashboard - Home</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#F0F9FF', 100: '#E0F2FE', 200: '#BAE6FD', 300: '#7DD3FC',
                            400: '#38BDF8', 500: '#0EA5E9', 600: '#0284C7', 700: '#0369A1',
                            800: '#075985', 900: '#0C4A6E',
                        },
                        hero: {
                            start: '#D2E8FA', end: '#CCE3F9', badge: '#B2D8FA', accent: '#0D9488'
                        },
                        slate: {
                            50: '#F8FAFC', 100: '#F1F5F9', 200: '#E2E8F0', 300: '#CBD5E1',
                            400: '#94A3B8', 500: '#64748B', 600: '#475569', 700: '#334155',
                            800: '#1E293B', 900: '#0F172A'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>

    <!-- Script de Control de Acceso por Cédula (REEMPLAZADO AQUÍ) -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Cédula autorizada
            const ALLOWED_CEDULA = '28573780';

            // Obtener datos del usuario desde la sesión
            const sessionUser = JSON.parse(
                localStorage.getItem('currentUser') || 
                sessionStorage.getItem('currentUser') || 
                'null'
            );

            // Extraer y normalizar la cédula guardada en sesión
            const userCedula = sessionUser?.cedula ? String(sessionUser.cedula).trim() : 
                               sessionUser?.id ? String(sessionUser.id).trim() : '';

            // Validación estricta: Coincidencia exacta de la cédula
            if (!sessionUser || userCedula !== ALLOWED_CEDULA) {
                alert('Acceso denegado. La cédula ingresada no corresponde a la Administradora.');
                
                // Limpiar datos inválidos y reorientar al Login
                localStorage.removeItem('currentUser');
                sessionStorage.removeItem('currentUser');
                window.location.href = 'login.html';
                return;
            }

            // Inyección del nombre si la validación es correcta
            const nameContainer = document.getElementById('admin-name');
            if (nameContainer) {
                nameContainer.textContent = sessionUser.fullName || 'Henmary Irausquin';
            }
        });

        function logout() {
            localStorage.removeItem('currentUser');
            sessionStorage.removeItem('currentUser');
            window.location.href = 'login.html';
        }
    </script>
</head>
