<head>

    <title>Administrator Dashboard - Home</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#F0F9FF', 100: '#E0F2FE', 200: '#BAE6FD', 300: '#7DD3FC',
                            400: '#38BDF8', 500: '#0EA5E9', 600: '#0284C7', 700: '#0369A1',
                            800: '#075985', 900: '#0C4A6E',
                        },
                        hero: {
                            start: '#D2E8FA', end: '#CCE3F9', badge: '#B2D8FA', accent: '#0D9488'
                        },
                        slate: {
                            50: '#F8FAFC', 100: '#F1F5F9', 200: '#E2E8F0', 300: '#CBD5E1',
                            400: '#94A3B8', 500: '#64748B', 600: '#475569', 700: '#334155',
                            800: '#1E293B', 900: '#0F172A'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Script de Control de Acceso por Cédula (REEMPLAZADO AQUÍ) -->
    <!-- Script de Control de Acceso por Cédula (VERSIÓN CORREGIDA) -->
<script>
    (function checkAuth() {
        const ALLOWED_CEDULA = '28573780';

        // Obtener datos crudos de sesión
        const rawUser = localStorage.getItem('currentUser') || sessionStorage.getItem('currentUser');
        const sessionUser = rawUser ? JSON.parse(rawUser) : null;

        // Inspección en consola para diagnóstico
        console.log('Datos de usuario en sesión:', sessionUser);

        // Buscar la cédula en cualquier campo común donde haya sido guardada
        const userCedula = sessionUser ? String(
            sessionUser.cedula || 
            sessionUser.id || 
            sessionUser.username || 
            sessionUser.identityCard || 
            ''
        ).replace(/\D/g, '') : ''; // Elimina puntos, espacios o guiones accidentalmente guardados

        // Validación estricta sin caracteres especiales
        if (!sessionUser || userCedula !== ALLOWED_CEDULA) {
            alert(`Acceso denegado. Cédula detectada: "${userCedula}". Se requiere: "${ALLOWED_CEDULA}".`);
            
            localStorage.removeItem('currentUser');
            sessionStorage.removeItem('currentUser');
            window.location.href = 'login.html';
            return;
        }

        // Inyectar nombre al cargar el DOM
        document.addEventListener('DOMContentLoaded', () => {
            const nameContainer = document.getElementById('admin-name');
            if (nameContainer) {
                nameContainer.textContent = sessionUser.fullName || sessionUser.name || 'Henmary Irausquin';
            }
        });
    })();

    function logout() {
        localStorage.removeItem('currentUser');
        sessionStorage.removeItem('currentUser');
        window.location.href = 'login.html';
    }
</script>
</head>
