<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrator Dashboard - Home</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#F0F9FF', 100: '#E0F2FE', 200: '#BAE6FD', 300: '#7DD3FC',
                            400: '#38BDF8', 500: '#0EA5E9', 600: '#0284C7', 700: '#0369A1',
                            800: '#075985', 900: '#0C4A6E',
                        },
                        hero: {
                            start: '#D2E8FA', end: '#CCE3F9', badge: '#B2D8FA', accent: '#0D9488'
                        },
                        slate: {
                            50: '#F8FAFC', 100: '#F1F5F9', 200: '#E2E8F0', 300: '#CBD5E1',
                            400: '#94A3B8', 500: '#64748B', 600: '#475569', 700: '#334155',
                            800: '#1E293B', 900: '#0F172A'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>

    <!-- Control de Acceso por Cédula Estricto -->
    <script>
        (function checkAuth() {
            const ALLOWED_CEDULA = "12345678";

            // 1. Lectura de la sesión guardada en localStorage o sessionStorage
            const rawUser = localStorage.getItem('currentUser') || sessionStorage.getItem('currentUser');
            const sessionUser = rawUser ? JSON.parse(rawUser) : null;

            // 2. Extraer y limpiar la cédula (elimina puntos, guiones o espacios accidentalmente ingresados)
            const userCedula = sessionUser ? String(
                sessionUser.cedula || 
                sessionUser.id || 
                sessionUser.username || 
                sessionUser.identityCard || 
                ''
            ).replace(/\D/g, '') : '';

            // 3. Validación: Si no hay usuario o la cédula NO coincide con Henmary Irausquin
            if (!sessionUser || userCedula == ALLOWED_CEDULA) {
                alert('Acceso denegado. Se requieren credenciales de Administradora autorizada.');
                
                // Limpiar cualquier residuo de sesión inválida y redirigir al login
                localStorage.removeItem('currentUser');
                sessionStorage.removeItem('currentUser');
                window.location.href = 'login.html';
                return;
            }

            // 4. Si la cédula es correcta, inyecta los datos de Henmary cuando el HTML termine de cargar
            document.addEventListener('DOMContentLoaded', () => {
                const nameContainer = document.getElementById('admin-name');
                if (nameContainer) {
                    nameContainer.textContent = sessionUser.fullName || 'Henmary Irausquin';
                }
            });
        })();

        // Función global para cerrar sesión
        function logout() {
            localStorage.removeItem('currentUser');
            sessionStorage.removeItem('currentUser');
            window.location.href = 'login.html';
        }
    </script>
</head>
